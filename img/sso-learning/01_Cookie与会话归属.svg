<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-label="浏览器按请求目标选择 Cookie，三个服务各自保存会话"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#31577f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="720" y="58" text-anchor="middle" font-size="30" fill="#153653" font-weight="600">同一浏览器中的三份 Cookie，对应三套服务端会话</text>
<rect x="55" y="100" width="1330" height="218" rx="15" fill="#edf5ff" stroke="#a6c0dc"/>
<text x="720" y="140" text-anchor="middle" font-size="23" fill="#183f68" font-weight="600">小林的浏览器：按 Cookie 适用范围保存</text>
<rect x="75" y="168" width="370" height="112" rx="10" fill="#fff" stroke="#b6cadd"/>
<text x="260" y="205" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">oa.example.net</text>
<text x="260" y="247" text-anchor="middle" font-size="23" fill="#153e68" font-weight="600">oa_session=A</text>
<line x1="260" y1="281" x2="260" y2="434" stroke="#31577f" stroke-width="2.3" marker-end="url(#a)"/>
<text x="260" y="365" text-anchor="middle" font-size="18" fill="#425c74" font-weight="400">请求目标为 OA</text>
<rect x="75" y="440" width="370" height="122" rx="10" fill="#ecf8f1" stroke="#9cc8ab"/>
<text x="260" y="480" text-anchor="middle" font-size="23" fill="#245b41" font-weight="600">OA 服务端</text>
<text x="260" y="524" text-anchor="middle" font-size="20" fill="#20354b" font-weight="400">A → 小林的 OA 会话</text>
<rect x="535" y="168" width="370" height="112" rx="10" fill="#fff" stroke="#b6cadd"/>
<text x="720" y="205" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">login.example.com</text>
<text x="720" y="247" text-anchor="middle" font-size="23" fill="#153e68" font-weight="600">idp_session=C</text>
<line x1="720" y1="281" x2="720" y2="434" stroke="#31577f" stroke-width="2.3" marker-end="url(#a)"/>
<text x="720" y="365" text-anchor="middle" font-size="18" fill="#425c74" font-weight="400">请求目标为 认证中心</text>
<rect x="535" y="440" width="370" height="122" rx="10" fill="#ecf8f1" stroke="#9cc8ab"/>
<text x="720" y="480" text-anchor="middle" font-size="23" fill="#245b41" font-weight="600">认证中心 服务端</text>
<text x="720" y="524" text-anchor="middle" font-size="20" fill="#20354b" font-weight="400">C → 小林的中心会话</text>
<rect x="995" y="168" width="370" height="112" rx="10" fill="#fff" stroke="#b6cadd"/>
<text x="1180" y="205" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">crm.example.org</text>
<text x="1180" y="247" text-anchor="middle" font-size="23" fill="#153e68" font-weight="600">crm_session=B</text>
<line x1="1180" y1="281" x2="1180" y2="434" stroke="#31577f" stroke-width="2.3" marker-end="url(#a)"/>
<text x="1180" y="365" text-anchor="middle" font-size="18" fill="#425c74" font-weight="400">请求目标为 CRM</text>
<rect x="995" y="440" width="370" height="122" rx="10" fill="#ecf8f1" stroke="#9cc8ab"/>
<text x="1180" y="480" text-anchor="middle" font-size="23" fill="#245b41" font-weight="600">CRM 服务端</text>
<text x="1180" y="524" text-anchor="middle" font-size="20" fill="#20354b" font-weight="400">B → 小林的 CRM 会话</text>
<rect x="55" y="606" width="1330" height="96" rx="10" fill="#f1f5f9" stroke="#d7e1eb"/>
<text x="80" y="642" text-anchor="start" font-size="20" fill="#20354b" font-weight="400">浏览器向哪个站点发请求，就按目标地址与 Cookie 规则挑选符合条件的数据。</text>
<text x="80" y="675" text-anchor="start" font-size="19" fill="#536c82" font-weight="400">图中只展示各系统的会话 Cookie；同一个请求还可能携带其他符合条件的 Cookie。</text>
</g></svg>