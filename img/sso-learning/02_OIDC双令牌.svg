<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1510" viewBox="0 0 1640 1510" role="img" aria-label="一次流程中的两个目标：登录助手与读取日程">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#31577f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="820" y="55" text-anchor="middle" font-size="30" fill="#153653" font-weight="600">一次流程中的两个目标：登录助手与读取日程</text>
<text x="820" y="92" text-anchor="middle" font-size="19" fill="#536c82" font-weight="400">示例假设身份平台和 OA API 已配置支持相应权限</text>
<rect x="30" y="130" width="260" height="72" rx="11" fill="#193f69"/>
<text x="160" y="174" text-anchor="middle" font-size="22" fill="#fff" font-weight="600">小林的浏览器</text>
<line x1="160" x2="160" y1="202" y2="1355" stroke="#b9c9d7" stroke-width="1.5" stroke-dasharray="7 7"/>
<rect x="470" y="130" width="260" height="72" rx="11" fill="#193f69"/>
<text x="600" y="174" text-anchor="middle" font-size="22" fill="#fff" font-weight="600">日程助手后端</text>
<line x1="600" x2="600" y1="202" y2="1355" stroke="#b9c9d7" stroke-width="1.5" stroke-dasharray="7 7"/>
<rect x="910" y="130" width="260" height="72" rx="11" fill="#193f69"/>
<text x="1040" y="174" text-anchor="middle" font-size="22" fill="#fff" font-weight="600">公司身份平台</text>
<line x1="1040" x2="1040" y1="202" y2="1355" stroke="#b9c9d7" stroke-width="1.5" stroke-dasharray="7 7"/>
<rect x="1350" y="130" width="260" height="72" rx="11" fill="#193f69"/>
<text x="1480" y="174" text-anchor="middle" font-size="22" fill="#fff" font-weight="600">OA 日程 API</text>
<line x1="1480" x2="1480" y1="202" y2="1355" stroke="#b9c9d7" stroke-width="1.5" stroke-dasharray="7 7"/>
<rect x="204.04" y="301" width="351.92" height="28" fill="#fff"/>
<text x="380" y="324" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">1. 选择使用公司账号登录，并连接日程</text>
<line x1="160" y1="342" x2="600" y2="342" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="219.62" y="391" width="320.76" height="28" fill="#fff"/>
<text x="380" y="414" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">2. 发起 OIDC 登录和日程授权请求</text>
<line x1="600" y1="432" x2="160" y2="432" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="462.03999999999996" y="481" width="275.92" height="28" fill="#fff"/>
<text x="600" y="504" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">3. 认证小林，按策略确认授权</text>
<line x1="160" y1="522" x2="1040" y2="522" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="474.58000000000004" y="571" width="250.83999999999997" height="28" fill="#fff"/>
<text x="600" y="594" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">4. 返回授权码 T 给浏览器</text>
<line x1="1040" y1="612" x2="160" y2="612" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="245.08" y="661" width="269.84" height="28" fill="#fff"/>
<text x="380" y="684" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">5. 浏览器将 T 转交助手回调</text>
<line x1="160" y1="702" x2="600" y2="702" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="656.58" y="751" width="326.84" height="28" fill="#fff"/>
<text x="820" y="774" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">6. 助手后端提交 T 等必要信息兑换</text>
<line x1="600" y1="792" x2="1040" y2="792" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="603.0000000000001" y="834" width="433.9999999999998" height="56" fill="#fff"/>
<text x="820" y="857" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">7. 返回 ID Token 和获准用于 OA 的 Access </text>
<text x="820" y="885" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">Token</text>
<line x1="1040" y1="903" x2="600" y2="903" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="435" y="921" width="330" height="84" rx="9" fill="#eaf5ef" stroke="#96c6a8"/>
<text x="600" y="949" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">验证 ID Token</text>
<text x="600" y="979" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">确认小林，建立助手本地会话</text>
<rect x="214.30000000000004" y="1076" width="331.3999999999999" height="28" fill="#fff"/>
<text x="380" y="1099" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">8. 给浏览器设置助手的会话 Cookie</text>
<line x1="600" y1="1117" x2="160" y2="1117" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="834.7800000000001" y="1166" width="410.43999999999977" height="28" fill="#fff"/>
<text x="1040" y="1189" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">9. 使用面向 OA 的 Access Token 查询日程</text>
<line x1="600" y1="1207" x2="1480" y2="1207" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="868.22" y="1256" width="343.56" height="28" fill="#fff"/>
<text x="1040" y="1279" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">10. 验证授权后，返回允许读取的日程</text>
<line x1="1480" y1="1297" x2="600" y2="1297" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="35" y="1380" width="1570" height="105" rx="10" fill="#f1f5f9" stroke="#d7e1eb"/>
<text x="55" y="1412" text-anchor="start" font-size="18" fill="#40596f" font-weight="400">ID Token 面向发起登录的助手；Access Token 面向获准的资源 API。一次流程可兼顾两项需求，也可以分开申请。</text>
</g></svg>