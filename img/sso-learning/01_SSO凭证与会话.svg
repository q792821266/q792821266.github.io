<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1793" viewBox="0 0 1640 1793" role="img" aria-label="基础 SSO：同一浏览器先登录 OA，再访问 CRM">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#31577f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="820" y="55" text-anchor="middle" font-size="30" fill="#153653" font-weight="600">基础 SSO：同一浏览器先登录 OA，再访问 CRM</text>
<text x="820" y="92" text-anchor="middle" font-size="19" fill="#536c82" font-weight="400">CRM 阶段假设中心 Cookie 和中心会话有效；否则需要重新认证</text>
<rect x="30" y="130" width="260" height="72" rx="11" fill="#193f69"/>
<text x="160" y="174" text-anchor="middle" font-size="22" fill="#fff" font-weight="600">小林的浏览器</text>
<line x1="160" x2="160" y1="202" y2="1638" stroke="#b9c9d7" stroke-width="1.5" stroke-dasharray="7 7"/>
<rect x="470" y="130" width="260" height="72" rx="11" fill="#193f69"/>
<text x="600" y="174" text-anchor="middle" font-size="22" fill="#fff" font-weight="600">OA 后端</text>
<line x1="600" x2="600" y1="202" y2="1638" stroke="#b9c9d7" stroke-width="1.5" stroke-dasharray="7 7"/>
<rect x="910" y="130" width="260" height="72" rx="11" fill="#193f69"/>
<text x="1040" y="174" text-anchor="middle" font-size="22" fill="#fff" font-weight="600">公司认证中心</text>
<line x1="1040" x2="1040" y1="202" y2="1638" stroke="#b9c9d7" stroke-width="1.5" stroke-dasharray="7 7"/>
<rect x="1350" y="130" width="260" height="72" rx="11" fill="#193f69"/>
<text x="1480" y="174" text-anchor="middle" font-size="22" fill="#fff" font-weight="600">CRM 后端</text>
<line x1="1480" x2="1480" y1="202" y2="1638" stroke="#b9c9d7" stroke-width="1.5" stroke-dasharray="7 7"/>
<rect x="245.07999999999998" y="301" width="269.84000000000003" height="28" fill="#fff"/>
<text x="380" y="324" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">1. 访问 OA，本地会话不存在</text>
<line x1="160" y1="342" x2="600" y2="342" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="261.03999999999996" y="391" width="237.92000000000002" height="28" fill="#fff"/>
<text x="380" y="414" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">2. 让浏览器访问认证中心</text>
<line x1="600" y1="432" x2="160" y2="432" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="433.53999999999996" y="481" width="332.92" height="28" fill="#fff"/>
<text x="600" y="504" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">3. 认证小林，或按规则复用中心会话</text>
<line x1="160" y1="522" x2="1040" y2="522" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="383.38000000000005" y="571" width="433.2399999999999" height="28" fill="#fff"/>
<text x="600" y="594" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">4. 签发给 OA 的登录凭证；保存中心 Cookie C</text>
<line x1="1040" y1="612" x2="160" y2="612" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="249.26000000000002" y="661" width="261.47999999999996" height="28" fill="#fff"/>
<text x="380" y="684" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">5. 提交登录凭证到 OA 回调</text>
<line x1="160" y1="702" x2="600" y2="702" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="435" y="720" width="330" height="84" rx="9" fill="#eaf5ef" stroke="#96c6a8"/>
<text x="600" y="748" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">OA 验证凭证</text>
<text x="600" y="778" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">创建 OA 本地会话 A</text>
<rect x="210.5000000000001" y="875" width="338.9999999999998" height="28" fill="#fff"/>
<text x="380" y="898" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">6. 返回 OA Cookie：oa_session=A</text>
<line x1="600" y1="916" x2="160" y2="916" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="681.6600000000001" y="965" width="276.67999999999995" height="28" fill="#fff"/>
<text x="820" y="988" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">7. 访问 CRM，尚无 CRM 会话</text>
<line x1="160" y1="1006" x2="1480" y2="1006" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="701.04" y="1055" width="237.92000000000002" height="28" fill="#fff"/>
<text x="820" y="1078" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">8. 让浏览器访问认证中心</text>
<line x1="1480" y1="1096" x2="160" y2="1096" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="461.6600000000001" y="1145" width="276.6799999999999" height="28" fill="#fff"/>
<text x="600" y="1168" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">9. 按规则携带中心 Cookie C</text>
<line x1="160" y1="1186" x2="1040" y2="1186" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="401.62" y="1235" width="396.75999999999993" height="28" fill="#fff"/>
<text x="600" y="1258" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">10. 复用中心会话，签发给 CRM 的登录凭证</text>
<line x1="1040" y1="1276" x2="160" y2="1276" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="678.62" y="1325" width="282.75999999999993" height="28" fill="#fff"/>
<text x="820" y="1348" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">11. 提交登录凭证到 CRM 回调</text>
<line x1="160" y1="1366" x2="1480" y2="1366" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="1295" y="1384" width="330" height="84" rx="9" fill="#eaf5ef" stroke="#96c6a8"/>
<text x="1460" y="1412" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">CRM 验证凭证</text>
<text x="1460" y="1442" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">创建 CRM 本地会话 B</text>
<rect x="634.5400000000002" y="1539" width="370.91999999999973" height="28" fill="#fff"/>
<text x="820" y="1562" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">12. 返回 CRM Cookie：crm_session=B</text>
<line x1="1480" y1="1580" x2="160" y2="1580" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="35" y="1663" width="1570" height="105" rx="10" fill="#f1f5f9" stroke="#d7e1eb"/>
<text x="55" y="1695" text-anchor="start" font-size="18" fill="#40596f" font-weight="400">中心 Cookie C、OA Cookie A 与 CRM Cookie B 按各自范围发送；业务应用收到的是面向自己的登录凭证。</text>
</g></svg>