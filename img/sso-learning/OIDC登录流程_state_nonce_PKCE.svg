<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1880" viewBox="0 0 1480 1880" role="img" aria-labelledby="title desc">
<title id="title">小林登录 OA：授权码 T 与 state、nonce、PKCE 的完整位置</title>
<desc id="desc">三方时序图，显示浏览器、OA 后端与认证中心的十步交互。code 就是前文的临时授权码 T。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#365c85"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#1d2e42">
<text x="740" y="58" text-anchor="middle" font-size="31" fill="#142f50" font-weight="600">小林登录 OA：把每个校验放回原来的流程</text>
<text x="740" y="100" text-anchor="middle" font-size="21" fill="#53677d" font-weight="400">code = 前文的临时授权码 T；OA 在本次交互中是 OIDC 客户端</text>
<rect x="25" y="140" width="330" height="78" rx="12" fill="#193f69"/>
<text x="190" y="172" text-anchor="middle" font-size="24" fill="#fff" font-weight="600">小林的浏览器</text>
<text x="190" y="201" text-anchor="middle" font-size="16" fill="#dce8f5" font-weight="400">负责请求与跳转</text>
<line x1="190" y1="218" x2="190" y2="1660" stroke="#b6c4d3" stroke-width="1.6" stroke-dasharray="7 7"/>
<rect x="575" y="140" width="330" height="78" rx="12" fill="#193f69"/>
<text x="740" y="172" text-anchor="middle" font-size="24" fill="#fff" font-weight="600">OA 后端</text>
<text x="740" y="201" text-anchor="middle" font-size="16" fill="#dce8f5" font-weight="400">发起登录、换码、验证、建会话</text>
<line x1="740" y1="218" x2="740" y2="1660" stroke="#b6c4d3" stroke-width="1.6" stroke-dasharray="7 7"/>
<rect x="1125" y="140" width="330" height="78" rx="12" fill="#193f69"/>
<text x="1290" y="172" text-anchor="middle" font-size="24" fill="#fff" font-weight="600">公司认证中心</text>
<text x="1290" y="201" text-anchor="middle" font-size="16" fill="#dce8f5" font-weight="400">认证用户、校验兑换、签发令牌</text>
<line x1="1290" y1="218" x2="1290" y2="1660" stroke="#b6c4d3" stroke-width="1.6" stroke-dasharray="7 7"/>
<rect x="362.20000000000005" y="241" width="205.59999999999994" height="29" fill="#fff"/>
<text x="465" y="264" text-anchor="middle" font-size="20" fill="#1d2e42" font-weight="400">1. 请求 OA /login</text>
<line x1="190" y1="280" x2="740" y2="280" stroke="#365c85" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="515" y="315" width="450" height="111" rx="10" fill="#edf5ff" stroke="#98b6d6"/>
<text x="740" y="342" text-anchor="middle" font-size="19" fill="#1d2e42" font-weight="400">创建 S、N、V，计算 H</text>
<text x="740" y="372" text-anchor="middle" font-size="19" fill="#1d2e42" font-weight="400">保存临时上下文并绑定当前浏览器</text>
<text x="740" y="402" text-anchor="middle" font-size="19" fill="#1d2e42" font-weight="400">此时还没有已登录的 OA 会话</text>
<rect x="283.40000000000003" y="426" width="363.19999999999993" height="29" fill="#fff"/>
<text x="465" y="449" text-anchor="middle" font-size="20" fill="#1d2e42" font-weight="400">2. 302 到中心；授权请求附 S、N、H</text>
<line x1="740" y1="465" x2="190" y2="465" stroke="#365c85" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="512.4000000000001" y="501" width="455.1999999999999" height="29" fill="#fff"/>
<text x="740" y="524" text-anchor="middle" font-size="20" fill="#1d2e42" font-weight="400">3. 请求 /authorize；按规则携带中心 Cookie</text>
<line x1="190" y1="540" x2="1290" y2="540" stroke="#365c85" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="1115" y="580" width="350" height="82" rx="10" fill="#edf5ff" stroke="#98b6d6"/>
<text x="1290" y="607" text-anchor="middle" font-size="19" fill="#1d2e42" font-weight="400">认证小林，或复用中心会话</text>
<text x="1290" y="637" text-anchor="middle" font-size="19" fill="#1d2e42" font-weight="400">关联本次 N、H；签发授权码 T</text>
<rect x="515.2000000000002" y="701" width="449.59999999999974" height="29" fill="#fff"/>
<text x="740" y="724" text-anchor="middle" font-size="20" fill="#1d2e42" font-weight="400">4a. 302 到 OA callback；code=T，state=S</text>
<line x1="1290" y1="740" x2="190" y2="740" stroke="#365c85" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="275.8" y="776" width="378.4" height="29" fill="#fff"/>
<text x="465" y="799" text-anchor="middle" font-size="20" fill="#1d2e42" font-weight="400">4b. 提交 T、S，并携带浏览器关联信息</text>
<line x1="190" y1="815" x2="740" y2="815" stroke="#365c85" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="515" y="855" width="450" height="82" rx="10" fill="#ecf8f1" stroke="#8dbca1"/>
<text x="740" y="882" text-anchor="middle" font-size="19" fill="#1d2e42" font-weight="400">5. OA 核对 state=S 与浏览器绑定</text>
<text x="740" y="912" text-anchor="middle" font-size="19" fill="#1d2e42" font-weight="400">检查事务有效期并一次性消费</text>
<rect x="809.8" y="971" width="410.4" height="29" fill="#fff"/>
<text x="1015" y="994" text-anchor="middle" font-size="20" fill="#1d2e42" font-weight="400">6. POST /token：T、V 与适用客户端认证</text>
<line x1="740" y1="1010" x2="1290" y2="1010" stroke="#365c85" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="1115" y="1050" width="350" height="111" rx="10" fill="#ecf8f1" stroke="#8dbca1"/>
<text x="1290" y="1077" text-anchor="middle" font-size="19" fill="#1d2e42" font-weight="400">检查授权码及其他兑换条件</text>
<text x="1290" y="1107" text-anchor="middle" font-size="19" fill="#1d2e42" font-weight="400">由 V 计算 H，与已记录的 H 比较</text>
<text x="1290" y="1137" text-anchor="middle" font-size="19" fill="#1d2e42" font-weight="400">不匹配则拒绝兑换</text>
<rect x="793.8000000000001" y="1171" width="442.3999999999998" height="29" fill="#fff"/>
<text x="1015" y="1194" text-anchor="middle" font-size="20" fill="#1d2e42" font-weight="400">7. 返回 ID Token（含 N）与 Access Token</text>
<line x1="1290" y1="1210" x2="740" y2="1210" stroke="#365c85" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="510" y="1250" width="460" height="111" rx="10" fill="#ecf8f1" stroke="#8dbca1"/>
<text x="740" y="1277" text-anchor="middle" font-size="19" fill="#1d2e42" font-weight="400">7. 验证签名、签发者、受众和时间</text>
<text x="740" y="1307" text-anchor="middle" font-size="19" fill="#1d2e42" font-weight="400">核对 ID Token 中的 nonce=N</text>
<text x="740" y="1337" text-anchor="middle" font-size="19" fill="#1d2e42" font-weight="400">8. 检查账号准入，创建本地会话 A</text>
<rect x="263.00000000000006" y="1406" width="403.9999999999999" height="29" fill="#fff"/>
<text x="465" y="1429" text-anchor="middle" font-size="20" fill="#1d2e42" font-weight="400">9. 设置 oa_session=A；302 到业务地址</text>
<line x1="740" y1="1445" x2="190" y2="1445" stroke="#365c85" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="269.80000000000007" y="1496" width="390.39999999999986" height="29" fill="#fff"/>
<text x="465" y="1519" text-anchor="middle" font-size="20" fill="#1d2e42" font-weight="400">10. 请求业务页面，携带 oa_session=A</text>
<line x1="190" y1="1535" x2="740" y2="1535" stroke="#365c85" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="345" y="1581" width="240" height="29" fill="#fff"/>
<text x="465" y="1604" text-anchor="middle" font-size="20" fill="#1d2e42" font-weight="400">返回小林有权访问的数据</text>
<line x1="740" y1="1620" x2="190" y2="1620" stroke="#365c85" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="40" y="1695" width="1400" height="145" rx="12" fill="#f3f6fa" stroke="#d4dde7"/>
<text x="70" y="1730" text-anchor="start" font-size="20" fill="#1d2e42" font-weight="400">对应关系：S = state；N = nonce；V = code_verifier；H = code_challenge；T = code</text>
<text x="70" y="1767" text-anchor="start" font-size="20" fill="#1d2e42" font-weight="400">三个核对位置：OA 收回调检查 S → 中心换码检查 V/H → OA 验证 ID Token 时检查 N</text>
<text x="70" y="1804" text-anchor="start" font-size="19" fill="#52667c" font-weight="400">所有通信使用 HTTPS。S、N、V 是随机值的示意记号；它们与登录后的本地会话 A 不同。</text>
</g></svg>