<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1223" viewBox="0 0 1400 1223" role="img" aria-label="签名凭证怎样帮助 OA 建立本地会话">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#31577f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="700" y="55" text-anchor="middle" font-size="30" fill="#153653" font-weight="600">签名凭证怎样帮助 OA 建立本地会话</text>
<text x="700" y="92" text-anchor="middle" font-size="19" fill="#536c82" font-weight="400">先验证中心签发的登录凭证，再由 OA 创建自己的会话</text>
<rect x="17.5" y="130" width="285" height="72" rx="11" fill="#193f69"/>
<text x="160" y="174" text-anchor="middle" font-size="22" fill="#fff" font-weight="600">小林的浏览器</text>
<line x1="160" x2="160" y1="202" y2="1068" stroke="#b9c9d7" stroke-width="1.5" stroke-dasharray="7 7"/>
<rect x="557.5" y="130" width="285" height="72" rx="11" fill="#193f69"/>
<text x="700" y="174" text-anchor="middle" font-size="22" fill="#fff" font-weight="600">OA 后端</text>
<line x1="700" x2="700" y1="202" y2="1068" stroke="#b9c9d7" stroke-width="1.5" stroke-dasharray="7 7"/>
<rect x="1097.5" y="130" width="285" height="72" rx="11" fill="#193f69"/>
<text x="1240" y="174" text-anchor="middle" font-size="22" fill="#fff" font-weight="600">公司认证中心</text>
<line x1="1240" x2="1240" y1="202" y2="1068" stroke="#b9c9d7" stroke-width="1.5" stroke-dasharray="7 7"/>
<rect x="273.8" y="301" width="312.4" height="28" fill="#fff"/>
<text x="430" y="324" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">1. 请求 OA，没有有效的 OA 会话</text>
<line x1="160" y1="342" x2="700" y2="342" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="535" y="360" width="330" height="54" rx="9" fill="#eaf5ef" stroke="#96c6a8"/>
<text x="700" y="388" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">保存本次登录请求的关联信息</text>
<rect x="311.03999999999996" y="485" width="237.92000000000002" height="28" fill="#fff"/>
<text x="430" y="508" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">2. 让浏览器访问认证中心</text>
<line x1="700" y1="526" x2="160" y2="526" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="524.04" y="575" width="351.92" height="28" fill="#fff"/>
<text x="700" y="598" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">3. 访问中心，认证小林或复用中心会话</text>
<line x1="160" y1="616" x2="1240" y2="616" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="540.76" y="665" width="318.47999999999996" height="28" fill="#fff"/>
<text x="700" y="688" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">4. 返回发给 OA 的带签名登录凭证</text>
<line x1="1240" y1="706" x2="160" y2="706" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="299.26" y="755" width="261.48" height="28" fill="#fff"/>
<text x="430" y="778" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">5. 向 OA 回调入口提交凭证</text>
<line x1="160" y1="796" x2="700" y2="796" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="535" y="814" width="330" height="84" rx="9" fill="#eaf5ef" stroke="#96c6a8"/>
<text x="700" y="842" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">验证签名、受众、时间和请求关联</text>
<text x="700" y="872" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">检查准入，创建本地会话 A</text>
<rect x="273.4200000000001" y="969" width="313.15999999999985" height="28" fill="#fff"/>
<text x="430" y="992" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">6. 设置 oa_session=A，进入 OA</text>
<line x1="700" y1="1010" x2="160" y2="1010" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="35" y="1093" width="1330" height="105" rx="10" fill="#f1f5f9" stroke="#d7e1eb"/>
<text x="55" y="1125" text-anchor="start" font-size="18" fill="#40596f" font-weight="400">OA 事先取得可信公钥。验证通过表示这份凭证满足本次登录的检查，不表示已经确认中心之后的所有状态变化。</text>
</g></svg>