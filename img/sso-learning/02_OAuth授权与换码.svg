<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1399" viewBox="0 0 1640 1399" role="img" aria-label="委托授权：日程助手怎样取得访问令牌">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#31577f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="820" y="55" text-anchor="middle" font-size="30" fill="#153653" font-weight="600">委托授权：日程助手怎样取得访问令牌</text>
<text x="820" y="92" text-anchor="middle" font-size="19" fill="#536c82" font-weight="400">小林确认授权；助手后端取得令牌；OA 日程 API 检查授权</text>
<rect x="30" y="130" width="260" height="72" rx="11" fill="#193f69"/>
<text x="160" y="174" text-anchor="middle" font-size="22" fill="#fff" font-weight="600">小林的浏览器</text>
<line x1="160" x2="160" y1="202" y2="1244" stroke="#b9c9d7" stroke-width="1.5" stroke-dasharray="7 7"/>
<rect x="470" y="130" width="260" height="72" rx="11" fill="#193f69"/>
<text x="600" y="174" text-anchor="middle" font-size="22" fill="#fff" font-weight="600">日程助手后端</text>
<line x1="600" x2="600" y1="202" y2="1244" stroke="#b9c9d7" stroke-width="1.5" stroke-dasharray="7 7"/>
<rect x="910" y="130" width="260" height="72" rx="11" fill="#193f69"/>
<text x="1040" y="174" text-anchor="middle" font-size="22" fill="#fff" font-weight="600">公司身份平台</text>
<line x1="1040" x2="1040" y1="202" y2="1244" stroke="#b9c9d7" stroke-width="1.5" stroke-dasharray="7 7"/>
<rect x="1350" y="130" width="260" height="72" rx="11" fill="#193f69"/>
<text x="1480" y="174" text-anchor="middle" font-size="22" fill="#fff" font-weight="600">OA 日程 API</text>
<line x1="1480" x2="1480" y1="202" y2="1244" stroke="#b9c9d7" stroke-width="1.5" stroke-dasharray="7 7"/>
<rect x="277.76" y="301" width="204.47999999999996" height="28" fill="#fff"/>
<text x="380" y="324" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">1. 点击连接 OA 日程</text>
<line x1="160" y1="342" x2="600" y2="342" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="213.54" y="391" width="332.92" height="28" fill="#fff"/>
<text x="380" y="414" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">2. 发起授权请求，引导浏览器到平台</text>
<line x1="600" y1="432" x2="160" y2="432" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="443.03999999999996" y="481" width="313.92" height="28" fill="#fff"/>
<text x="600" y="504" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">3. 平台认证小林，按策略取得授权</text>
<line x1="160" y1="522" x2="1040" y2="522" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="498.9" y="571" width="202.2" height="28" fill="#fff"/>
<text x="600" y="594" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">4. 返回短期授权码 T</text>
<line x1="1040" y1="612" x2="160" y2="612" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="237.48000000000005" y="661" width="285.0399999999999" height="28" fill="#fff"/>
<text x="380" y="684" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">5. 浏览器把 code=T 带回助手</text>
<line x1="160" y1="702" x2="600" y2="702" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="647.08" y="751" width="345.84" height="28" fill="#fff"/>
<text x="820" y="774" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">6. 后端提交 T 和适用的兑换保护信息</text>
<line x1="600" y1="792" x2="1040" y2="792" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="653.54" y="841" width="332.92" height="28" fill="#fff"/>
<text x="820" y="864" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">7. 检查条件后，向后端返回访问令牌</text>
<line x1="1040" y1="882" x2="600" y2="882" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="873.54" y="931" width="332.92" height="28" fill="#fff"/>
<text x="1040" y="954" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">8. 助手后端携带令牌请求小林的日程</text>
<line x1="600" y1="972" x2="1480" y2="972" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="1295" y="990" width="330" height="84" rx="9" fill="#eaf5ef" stroke="#96c6a8"/>
<text x="1460" y="1018" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">OA 验证令牌</text>
<text x="1460" y="1048" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">检查小林的数据权限</text>
<rect x="930.54" y="1145" width="218.92000000000002" height="28" fill="#fff"/>
<text x="1040" y="1168" text-anchor="middle" font-size="19" fill="#20354b" font-weight="400">9. 返回允许读取的日程</text>
<line x1="1480" y1="1186" x2="600" y2="1186" stroke="#31577f" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="35" y="1269" width="1570" height="105" rx="10" fill="#f1f5f9" stroke="#d7e1eb"/>
<text x="55" y="1301" text-anchor="start" font-size="18" fill="#40596f" font-weight="400">T 是授权码，不是访问令牌。本图省略事务关联和 PKCE 等细节，它们在第 9 章展开。</text>
</g></svg>